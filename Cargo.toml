[package]
name = "waltzgps"
version = "0.1.0"
edition = "2021"
description = "A GTK4 map viewer for Tile Map Service / Web-Mercator providers"
license = "MIT"

[dependencies]
# UI toolkit. `gtk` is the crate `gtk4` renamed so the code reads `gtk::...`.
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
# Used directly for the cache-directory file-chooser dialog's async callback
# types (gtk4 depends on it transitively but doesn't re-export it).
gio = "0.20"
# Config (de)serialisation.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Async channel bridging the worker threads to the GTK main loop
# (`glib::spawn_future_local`). `futures-util` provides `StreamExt::next`.
futures-channel = "0.3"
futures-util = "0.3"
clap = { version = "4.6.6", features = ["derive"] }

# Tile downloads use the system `curl` binary via std::process, so no HTTP/TLS
# crate dependency is required. XDG paths and error handling use std only.

[profile.release]
opt-level = 2
